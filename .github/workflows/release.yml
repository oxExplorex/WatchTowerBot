name: Release WatchTower

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'VERSION'

concurrency:
  group: watchtower-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-2022
    timeout-minutes: 25
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Read release version
        id: version
        run: |
          version="$(tr -d '\r\n' < VERSION)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'VERSION must contain a version such as 2.1.2' >&2
            exit 1
          fi
          echo "number=$version" >> "$GITHUB_OUTPUT"
      - name: Package bot without the archive viewer
        env:
          VERSION: ${{ steps.version.outputs.number }}
        run: |
          mkdir -p dist/bot
          archive="WatchTower-Bot-${VERSION}.zip"
          git archive --format=zip --prefix="WatchTower-Bot-${VERSION}/" \
            --output="dist/bot/$archive" "$GITHUB_SHA" -- . \
            ':(exclude)archive_viewer' \
            ':(exclude)view_archive.bat' \
            ':(exclude)scripts/build_archive_viewer.py' \
            ':(exclude)scripts/viewer_entry.py' \
            ':(exclude).github' \
            ':(exclude).local-notes' \
            ':(exclude)tests'
          (cd dist/bot && sha256sum "$archive" > "$archive.sha256")
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.14'
          architecture: x64
      - name: Build and test Windows viewer
        run: |
          python -m pip install -r archive_viewer/requirements-build.txt
          python scripts/build_archive_viewer.py
      - name: Publish combined release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.version.outputs.number }}
        run: |
          tag="v${VERSION}"
          if gh release view "$tag" >/dev/null 2>&1; then
            release_sha="$(gh api "repos/$GH_REPO/commits/$tag" --jq .sha)"
            if [[ "$release_sha" != "$GITHUB_SHA" ]]; then
              echo "Release $tag already belongs to another commit. Increase VERSION." >&2
              exit 1
            fi
          else
            cat > dist/release-notes.md <<NOTES
          ## WatchTower ${VERSION}

          - **WatchTower-Bot-${VERSION}.zip** — Telegram-бот для Windows и Linux. Требуются Python и зависимости проекта; установка описана в README.md.
          - **WatchTower-Viewer-${VERSION}-Windows-x64.zip** — программа просмотра дампов. Распакуйте ZIP и запустите WatchTowerViewer.exe; Python не требуется.

          Конфигурация, сессии и пользовательские данные в поставку не входят. Рядом с ZIP опубликованы контрольные суммы SHA-256.
          Автоматические архивы GitHub «Source code» содержат полный репозиторий.
          NOTES
            gh release create "$tag" --target "$GITHUB_SHA" \
              --title "$tag" --notes-file dist/release-notes.md --draft
          fi
          gh release upload "$tag" dist/bot/*.zip dist/bot/*.sha256 \
            dist/archive-viewer/*.zip dist/archive-viewer/*.sha256 \
            dist/archive-viewer/viewer-update.json --clobber
          gh release edit "$tag" --title "$tag" --draft=false --latest
      - name: Keep existing viewer installations updatable
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Old EXEs use this fixed URL. Do not create another legacy release.
          if gh release view archive-viewer >/dev/null 2>&1; then
            mkdir -p dist/compat
            python -c "import json, pathlib, shutil; src=pathlib.Path('dist/archive-viewer'); dst=pathlib.Path('dist/compat'); m=json.loads((src/'viewer-update.json').read_text()); shutil.copy2(src/m['archive'], dst/'WatchTowerViewer-windows-x64.zip'); m['archive']='WatchTowerViewer-windows-x64.zip'; m.pop('release_tag', None); (dst/'viewer-update.json').write_text(json.dumps(m), encoding='utf-8')"
            (cd dist/compat && sha256sum WatchTowerViewer-windows-x64.zip > WatchTowerViewer-windows-x64.zip.sha256)
            gh release upload archive-viewer dist/compat/* --clobber
          fi
