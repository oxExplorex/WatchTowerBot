name: Build archive viewer

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'archive_viewer/**'
      - 'core/backup_format.py'
      - 'core/backup_parts.py'
      - 'core/avatar_records.py'
      - 'core/personal_crypto.py'
      - 'core/compression.py'
      - 'core/viewer_distribution.py'
      - 'scripts/build_archive_viewer.py'
      - 'scripts/viewer_entry.py'
      - '.github/workflows/archive-viewer.yml'

concurrency:
  group: archive-viewer
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  windows:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-2022
    timeout-minutes: 20
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.14'
          architecture: x64
      - name: Install standalone build dependencies
        run: python -m pip install -r archive_viewer/requirements-build.txt
      - name: Build and test the standalone executable
        run: python scripts/build_archive_viewer.py
      - name: Publish download
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! gh release view archive-viewer >/dev/null 2>&1; then
            gh release create archive-viewer --target "$GITHUB_SHA" --title "WatchTower Archive Viewer" --notes "Standalone Windows x64 viewer. Extract the ZIP and run WatchTowerViewer.exe. Archives stay on your computer." --latest=false
          fi
          gh release upload archive-viewer dist/archive-viewer/*.zip dist/archive-viewer/*.sha256 --clobber
          gh release upload archive-viewer dist/archive-viewer/viewer-update.json --clobber
