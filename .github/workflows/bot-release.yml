name: Release bot

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'VERSION'
      - '.github/workflows/bot-release.yml'

concurrency:
  group: bot-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Read bot version
        id: version
        run: |
          version="$(tr -d '\r\n' < VERSION)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'VERSION must contain a version such as 2.1.1' >&2
            exit 1
          fi
          echo "number=$version" >> "$GITHUB_OUTPUT"
      - name: Package bot without the archive viewer
        env:
          VERSION: ${{ steps.version.outputs.number }}
        run: |
          mkdir -p dist/bot
          archive="WatchTowerBot-${VERSION}.zip"
          git archive --format=zip --prefix="WatchTowerBot-${VERSION}/" \
            --output="dist/bot/$archive" "$GITHUB_SHA" -- . \
            ':(exclude)archive_viewer' \
            ':(exclude)view_archive.bat' \
            ':(exclude)scripts/build_archive_viewer.py' \
            ':(exclude)scripts/viewer_entry.py' \
            ':(exclude).github' \
            ':(exclude).local-notes' \
            ':(exclude)tests'
          (cd dist/bot && sha256sum "$archive" > "$archive.sha256")
      - name: Publish bot release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.version.outputs.number }}
        run: |
          tag="v${VERSION}"
          if gh release view "$tag" >/dev/null 2>&1; then
            release_sha="$(gh api "repos/$GH_REPO/commits/$tag" --jq .sha)"
            if [[ "$release_sha" != "$GITHUB_SHA" ]]; then
              echo "Release $tag already belongs to another commit. Increase VERSION." >&2
              exit 1
            fi
          else
            cat > dist/bot/release-notes.md <<'NOTES'
          Исходный код Telegram-бота без программы просмотра архивов.

          Скачайте **WatchTowerBot-VERSION.zip**, распакуйте и следуйте README.md.
          Требуются Python и зависимости проекта. Конфигурация и пользовательские данные в поставку не входят.

          **WatchTower Archive Viewer** распространяется отдельным релизом.
          Автоматические GitHub-архивы «Source code» содержат весь репозиторий; для установки бота используйте ZIP выше.
          NOTES
            sed -i "s/WatchTowerBot-VERSION/WatchTowerBot-${VERSION}/g" dist/bot/release-notes.md
            gh release create "$tag" --target "$GITHUB_SHA" \
              --title "WatchTowerBot v${VERSION}" \
              --notes-file dist/bot/release-notes.md --draft
          fi
          gh release upload "$tag" dist/bot/*.zip dist/bot/*.sha256 --clobber
          gh release edit "$tag" --draft=false --latest
